<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#c01c15">
    <title>Sin conexión · MyBarber</title>
    <style>
        :root { color-scheme: light; }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 32px 20px;
            background: radial-gradient(circle at 50% 12%, rgba(192, 28, 21, 0.10) 0%, #f8fafc 68%);
            color: #1e293b;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
        }

        .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; }

        .logo {
            width: 96px;
            height: 96px;
            object-fit: contain;
            padding: 10px;
            border-radius: 18px;
            background: #ffffff;
            border: 1px solid rgba(192, 28, 21, 0.25);
            box-shadow: 0 0 25px -5px rgba(192, 28, 21, 0.30);
        }

        h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }

        .accent { color: #c01c15; }

        p { margin: 0; max-width: 320px; font-size: 13px; line-height: 1.5; color: #64748b; }

        button {
            margin-top: 6px;
            padding: 13px 26px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(to right, #c01c15, #e57068);
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.03em;
            cursor: pointer;
            box-shadow: 0 8px 24px -6px rgba(192, 28, 21, 0.5);
        }

        button:active { transform: scale(0.98); }

        .hint { font-size: 11px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="brand">
        <img src="/mybarberlogo.png" alt="MyBarber" class="logo">
        <h1>MY <span class="accent">BARBER</span></h1>
    </div>

    <p><strong style="color:#1e293b">Sin conexión.</strong><br>
        No pudimos cargar la aplicación. Revisa tu conexión a internet e inténtalo de nuevo.</p>

    <button type="button" onclick="location.reload()">Reintentar</button>

    <span class="hint">Los datos se muestran siempre en línea</span>
</body>
</html>
